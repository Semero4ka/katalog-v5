<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a237e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Каталог оптовых цен</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--p:#1a237e;--pl:#31479a;--bg:#eef1f6;--tx:#22304a;--bd:#d7dce6;--dg:#c62828;--ok:#2e7d32;--w:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--p);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;opacity:.9;margin-top:3px}
.topbar{display:flex;gap:10px;margin:12px 10px 0}
.tbtn{flex:1;background:var(--w);color:var(--p);border:1px solid var(--bd);border-radius:12px;padding:11px 10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{background:#f4b400;color:#3a2c00;border-radius:999px;padding:1px 8px;font-size:13px;min-width:22px;text-align:center}
.controls{display:flex;gap:8px;margin:10px;padding:0}
.controls select,.controls input{flex:1;padding:11px;border:1px solid var(--bd);border-radius:12px;font-size:15px;background:var(--w)}
.grid{display:grid;grid-template-columns:1fr;gap:10px;padding:0 10px 90px;max-width:640px;margin:0 auto}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.pcard{background:var(--w);border-radius:14px;padding:10px;display:flex;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.pimg{width:64px;height:64px;border-radius:10px;background:#f0f2f7;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden;cursor:pointer}
.pimg img{width:100%;height:100%;object-fit:cover}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:14px;line-height:1.3}
.pgrp{font-size:11px;color:#7a8499;text-transform:uppercase;margin-top:2px}
.pprice{color:var(--p);font-weight:800;font-size:16px;margin-top:4px}
.pact{display:flex;flex-direction:column;gap:6px;justify-content:center;flex-shrink:0}
.stepper{display:flex;align-items:center;border:1.5px solid var(--p);border-radius:10px;overflow:hidden}
.stepper button{width:34px;height:36px;border:none;background:var(--w);color:var(--p);font-size:20px;font-weight:800;cursor:pointer}
.stepper input{width:40px;height:36px;border:none;border-left:1px solid var(--bd);border-right:1px solid var(--bd);text-align:center;font-size:15px;font-weight:700;color:var(--tx);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.addbtn{background:var(--p);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer}
.addbtn:active{background:var(--pl)}
.screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding-bottom:80px}
.screen.open{display:block}
.sh{background:var(--p);color:#fff;padding:14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.sh h2{margin:0;font-size:18px;flex:1}
.bk{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;padding:8px 12px;border-radius:10px;cursor:pointer}
.mo{position:fixed;inset:0;background:rgba(10,16,32,.55);z-index:200;display:none;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
@media(min-width:520px){.mo{align-items:center}}
.mbox{background:var(--w);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow-y:auto}
@media(min-width:520px){.mbox{border-radius:18px}}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mhead h3{margin:0;font-size:18px;flex:1}
.mx{background:#eef1f6;border:none;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--tx)}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:13px;color:#5a6478;margin-bottom:5px}
.fg input,.fg textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:15px;font-family:inherit}
.mbtn{width:100%;background:var(--p);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.ghbtn{background:var(--w);color:var(--p);border:1px solid var(--bd)}
.citem{background:var(--w);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;margin:0 10px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cname{flex:1;min-width:0}
.cname .n{font-weight:700;font-size:14px}
.cname .pr{font-size:13px;color:#5a6478;margin-top:2px}
.total{margin:10px;padding:14px;background:var(--w);border-radius:12px;font-size:17px;font-weight:800;display:flex;justify-content:space-between}
.ostab{display:flex;gap:8px;margin:10px}
.ostab button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--bd);background:var(--w);font-weight:700;font-size:14px;cursor:pointer;color:var(--tx)}
.ostab button.on{background:var(--p);border-color:var(--p);color:#fff}
.ocard{background:var(--w);border-radius:12px;padding:12px;margin:0 10px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ocard .ot{font-weight:800;font-size:15px}
.ocard .om{font-size:13px;color:#5a6478;margin:4px 0 10px}
.obtns{display:flex;gap:8px;flex-wrap:wrap}
.obtns button{flex:1;min-width:100px;padding:9px;border-radius:10px;border:1px solid var(--bd);background:#f7f8fb;font-size:13px;font-weight:600;cursor:pointer}
.b-done{border-color:var(--ok)!important;color:var(--ok)}
.b-del{color:var(--dg)!important}
.invwrap{margin:12px;padding:16px;background:var(--w);border-radius:12px}
.invwrap h3{margin:0 0 2px;text-align:center}
.invwrap .ihead{text-align:center;font-size:13px;color:#5a6478;margin-bottom:12px}
table.inv{width:100%;border-collapse:collapse;font-size:13px}
table.inv th,table.inv td{border:1px solid var(--bd);padding:6px 6px;text-align:left}
table.inv th{background:#f2f4f9}
table.inv .r{text-align:right}
.sig{display:flex;justify-content:space-between;margin-top:26px;font-size:13px}
.sig .l{border-top:1px solid var(--tx);padding-top:3px;min-width:120px}
.abar{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.abar button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--bd);background:var(--w);font-weight:700;font-size:14px;cursor:pointer}
.pbtn{background:var(--p)!important;color:#fff;border:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--p);color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:500;transition:transform .25s;pointer-events:none;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
#imgview{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;display:none;align-items:center;justify-content:center}
#imgview.open{display:flex}
#imgview img{max-width:95vw;max-height:90vh;border-radius:8px}
.hint{margin:8px 10px 0;background:#e3ecfa;border:1px solid #c3d5f2;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.hint button{margin-left:auto;background:none;border:none;font-size:16px;cursor:pointer;color:#5a6478}
.fab{position:fixed;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;background:var(--w);border:1px solid var(--bd);font-size:20px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15);z-index:60}
.empty{text-align:center;color:#7a8499;padding:30px 20px;font-size:15px}
@media print{body *{visibility:hidden}.screen.open,.screen.open *{visibility:visible}.screen.open{position:static;overflow:visible}.abar,.sh{display:none!important}}
</style>
</head>
<body>

<header>
  <h1>Каталог оптовых цен</h1>
  <div class="sub">Цены оптовые, без НДС, с доставкой</div>
</header>

<div class="topbar">
  <button class="tbtn" onclick="showCart()">🛒 Корзина <span class="badge" id="bCart">0</span></button>
  <button class="tbtn" onclick="showOrders()">📋 Заявки <span class="badge" id="bOrd">0</span></button>
</div>

<div class="controls">
  <select id="fCat" onchange="renderProducts()"><option value="">Все категории</option></select>
  <input id="fSearch" type="search" placeholder="🔍 Поиск товара" oninput="renderProducts()">
</div>

<div class="hint" id="hintInstall" style="display:none">
  📲 Добавьте каталог на главный экран — будет работать как приложение.
  <button onclick="closeHint()">✕</button>
</div>

<div class="grid" id="pgrid"></div>

<button class="fab" title="Подпись и поставщик" onclick="openSettings()">⚙️</button>

<!-- Экран корзины -->
<div class="screen" id="scrCart">
  <div class="sh"><button class="bk" onclick="closeScreens()">←</button><h2>🛒 Корзина</h2></div>
  <div id="cartList"></div>
  <div class="total" id="cartTotal" style="display:none"><span>Итого:</span><span id="cartSum"></span></div>
  <div class="abar" id="cartBar" style="display:none">
    <button class="ghbtn" onclick="clearCart()">🗑 Очистить</button>
    <button class="pbtn" onclick="showOrderForm()">Оформить заказ</button>
  </div>
</div>

<!-- Экран оформления -->
<div class="screen" id="scrForm">
  <div class="sh"><button class="bk" onclick="showCart()">←</button><h2>Оформление заказа</h2></div>
  <div style="margin:12px">
    <div class="fg"><label>Ваше имя / название организации *</label><input id="ofName"></div>
    <div class="fg"><label>Телефон *</label><input id="ofPhone" type="tel" placeholder="+7..."></div>
    <div class="fg"><label>Комментарий (необязательно)</label><textarea id="ofComm" rows="2"></textarea></div>
    <button class="mbtn" onclick="createOrder()">✅ Создать заявку</button>
  </div>
</div>

<!-- Экран заявок -->
<div class="screen" id="scrOrders">
  <div class="sh"><button class="bk" onclick="closeScreens()">←</button><h2>📋 Заявки</h2><button class="bk" onclick="openSettings()">⚙️</button></div>
  <div class="ostab">
    <button id="tabAll" class="on" onclick="setOTab('all')">Все</button>
    <button id="tabNew" onclick="setOTab('new')">Необработанные</button>
    <button id="tabDone" onclick="setOTab('done')">Выполненные</button>
  </div>
  <div id="ordList"></div>
  <p style="text-align:center;color:#7a8499;font-size:12px;padding:10px 20px">Заявки хранятся в памяти этого браузера и не пропадут при закрытии.</p>
</div>

<!-- Экран накладной -->
<div class="screen" id="scrInv">
  <div class="sh"><button class="bk" onclick="backToOrders()">←</button><h2>Накладная</h2></div>
  <div class="invwrap" id="invBody"></div>
  <div class="abar">
    <button class="ghbtn" onclick="saveInvToOrder()">💾 Сохранить в заявке</button>
    <button class="ghbtn" onclick="exportCSV()">⬇ CSV для 1С</button>
    <button class="pbtn" onclick="window.print()">🖨 Печать</button>
  </div>
</div>

<!-- Модалка настроек: открывается ТОЛЬКО по кнопке -->
<div class="mo" id="mSet">
  <div class="mbox">
    <div class="mhead"><h3>⚙️ Подпись и поставщик</h3><button class="mx" onclick="closeSettings()">✕</button></div>
    <div class="fg"><label>Поставщик (для шапки накладной)</label><input id="stSup"></div>
    <div class="fg"><label>ФИО для строки «Отпустил»</label><input id="stRel"></div>
    <div class="fg"><label>Следующий номер накладной</label><input id="stNum" type="number" min="1"></div>
    <button class="mbtn" onclick="saveSettings()">Сохранить</button>
  </div>
</div>

<div id="imgview" onclick="this.classList.remove('open')"><img id="imgviewImg"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
"use strict";
/* ---------- Данные: адаптивный разбор ---------- */
var PL=[];      // товары {id,n,p,g}
var GRPS=[];    // группы

function findGlobal(names){for(var i=0;i<names.length;i++){try{if(window[names[i]]!==undefined)return window[names[i]];}catch(e){}}return null;}
function findGroups(){
  var g=findGlobal(['groups','GROUPS','categories','CATEGORIES','group_list','Groups']);
  if(Array.isArray(g)&&g.length&&typeof g[0]==='string')return g.slice();
  return [];
}
function parseItem(it,defG){
  if(Array.isArray(it)){
    var len=it.length;
    if(len>=4&&GRPS.indexOf(String(it[0]))>=0){
      return {g:String(it[0]),n:String(it[1]),p:num(String(it[2])),id:String(it[3])};
    }
    if(len>=3){return {g:defG||null,n:String(it[0]),p:num(String(it[1])),id:String(it[2])};}
    if(len===2){return {g:defG||null,n:String(it[0]),p:num(String(it[1])),id:'a'+Math.random().toString(36).slice(2,9)};}
  }
  if(it&&typeof it==='object'){
    return {g:it.g||it.group||it.category||it.grp||defG||null,
      n:String(it.n||it.name||it.title||it['Наименование']||it['наименование']||it.product||''),
      p:num(String(it.p!==undefined?it.p:(it.price!==undefined?it.price:(it.cost!==undefined?it.cost:0)))),
      id:String(it.id!==undefined?it.id:(it.code!==undefined?it.code:(it.sku!==undefined?it.sku:Math.random().toString(36).slice(2,9))))};
  }
  return null;
}
function num(s){var v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isNaN(v)?0:v;}

function collectData(){
  GRPS=findGroups();
  var raw=findGlobal(['products','PRODUCTS','data','DATA','goods','GOODS','items','ITEMS','catalog','CATALOG','tovary','TOVARY','Rows','rows']);
  if(!raw){PL=[];return;}
  if(Array.isArray(raw)){
    // пары [группа, [товары]]
    if(raw.length&&Array.isArray(raw[0])&&raw[0].length===2&&Array.isArray(raw[0][1])){
      raw.forEach(function(pair){
        var g=String(pair[0]);
        if(GRPS.indexOf(g)<0)GRPS.push(g);
        (pair[1]||[]).forEach(function(it){var o=parseItem(it,g);if(o&&o.n)PL.push(o);});
      });
      return;
    }
    raw.forEach(function(it){var o=parseItem(it,null);if(o&&o.n)PL.push(o);});
  } else if(raw&&typeof raw==='object'){
    for(var g in raw){
      if(GRPS.indexOf(g)<0)GRPS.push(g);
      var arr=raw[g];
      if(Array.isArray(arr))arr.forEach(function(it){var o=parseItem(it,g);if(o&&o.n)PL.push(o);});
    }
  }
  if(!GRPS.length){var seen={};PL.forEach(function(x){if(x.g&&!seen[x.g]){seen[x.g]=1;}});GRPS=Object.keys(seen);}
}

/* ---------- Хранилище ---------- */
function LS(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function LSs(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var cart=LS('katalog_cart',{});
var orders=LS('katalog_orders',[]);
var settings=LS('katalog_settings',{sup:'',rel:'',num:0});
var invNum=LS('katalog_inv_num',settings.num||35001);
var oTab='all', curInvOrder=null;

/* ---------- Утилиты ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function fmt(v){return v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(iso){var d=new Date(iso);if(isNaN(d))return 'дата неизвестна';var p=function(x){return (x<10?'0':'')+x;};return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show');},2200);}

/* ---------- Каталог ---------- */
function renderCats(){
  var sel=document.getElementById('fCat');
  GRPS.slice().sort().forEach(function(g){var o=document.createElement('option');o.value=g;o.textContent=g;sel.appendChild(o);});
}
function renderProducts(){
  var cat=document.getElementById('fCat').value;
  var q=document.getElementById('fSearch').value.trim().toLowerCase();
  var box=document.getElementById('pgrid');box.innerHTML='';
  var list=PL.filter(function(p){if(cat&&p.g!==cat)return false;if(q&&p.n.toLowerCase().indexOf(q)<0)return false;return true;});
  if(!list.length){box.innerHTML='<div class="empty">Товары не найдены</div>';return;}
  var frag=document.createDocumentFragment();
  list.forEach(function(p){
    var d=document.createElement('div');d.className='pcard';
    d.innerHTML=
      '<div class="pimg" onclick="zoomImg(\''+esc(p.id)+'\')">📦</div>'+
      '<div class="pinfo"><div class="pname">'+esc(p.n)+'</div>'+(p.g?'<div class="pgrp">'+esc(p.g)+'</div>':'')+'<div class="pprice">'+fmt(p.p)+' ₽</div></div>'+
      '<div class="pact"><div class="stepper">'+
        '<button onclick="stepCard(\''+esc(p.id)+'\',-1)">−</button>'+
        '<input type="number" min="1" value="1" id="q_'+esc(p.id)+'" onchange="clampCard(\''+esc(p.id)+'\')">'+
        '<button onclick="stepCard(\''+esc(p.id)+'\',1)">+</button>'+
      '</div>'+
      '<button class="addbtn" onclick="addFromCard(\''+esc(p.id)+'\')">В корзину</button></div>';
    var img=d.querySelector('.pimg');
    var im=new Image();im.alt='';im.loading='lazy';
    im.onload=function(){img.innerHTML='';img.appendChild(im);};
    im.onerror=function(){img.textContent='📦';};
    im.src='img/'+encodeURIComponent(p.id)+'.jpg';
    frag.appendChild(d);
  });
  box.appendChild(frag);
}
function stepCard(id,d){var inp=document.getElementById('q_'+id);if(!inp)return;var v=parseInt(inp.value,10)||1;v=Math.max(1,v+d);inp.value=v;}
function clampCard(id){var inp=document.getElementById('q_'+id);if(!inp)return;var v=parseInt(inp.value,10);if(!v||v<1)v=1;inp.value=v;}
function addFromCard(id){
  var inp=document.getElementById('q_'+id);var q=inp?Math.max(1,parseInt(inp.value,10)||1):1;
  var p=findP(id);if(!p)return;
  cart[id]=(cart[id]||0)+q;LSs('katalog_cart',cart);updateBadges();
  toast('Добавлено: '+p.n+' × '+q);
}
function findP(id){for(var i=0;i<PL.length;i++)if(PL[i].id===id)return PL[i];return null;}
function zoomImg(id){var v=document.getElementById('imgview');var im=document.getElementById('imgviewImg');im.src='img/'+encodeURIComponent(id)+'.jpg';v.classList.add('open');}

/* ---------- Корзина ---------- */
function cartCount(){var s=0;for(var k in cart)s+=cart[k];return s;}
function cartSum(){var s=0;for(var k in cart){var p=findP(k);if(p)s+=p.p*cart[k];}return s;}
function updateBadges(){document.getElementById('bCart').textContent=cartCount();document.getElementById('bOrd').textContent=orders.filter(function(o){return !o.done;}).length;}
function showCart(){
  closeScreens();document.getElementById('scrCart').classList.add('open');
  var box=document.getElementById('cartList');box.innerHTML='';
  var keys=Object.keys(cart);
  document.getElementById('cartBar').style.display=keys.length?'flex':'none';
  document.getElementById('cartTotal').style.display=keys.length?'flex':'none';
  if(!keys.length){box.innerHTML='<div class="empty">Корзина пуста</div>';return;}
  keys.forEach(function(id){
    var p=findP(id);if(!p)return;
    var d=document.createElement('div');d.className='citem';
    d.innerHTML='<div class="cname"><div class="n">'+esc(p.n)+'</div><div class="pr">'+fmt(p.p)+' ₽ × '+cart[id]+' = '+fmt(p.p*cart[id])+' ₽</div></div>'+
      '<div class="stepper"><button onclick="stepCart(\''+esc(id)+'\',-1)">−</button><input type="number" min="1" value="'+cart[id]+'" id="cq_'+esc(id)+'" onchange="clampCart(\''+esc(id)+'\')"><button onclick="stepCart(\''+esc(id)+'\',1)">+</button></div>'+
      '<button class="mx" onclick="rmCart(\''+esc(id)+'\')" title="Убрать">🗑</button>';
    box.appendChild(d);
  });
  document.getElementById('cartSum').textContent=fmt(cartSum())+' ₽';
}
function stepCart(id,d){var inp=document.getElementById('cq_'+id);if(!inp)return;var v=(parseInt(inp.value,10)||1)+d;if(v<1)v=1;inp.value=v;setCart(id,v);}
function clampCart(id){var inp=document.getElementById('cq_'+id);if(!inp)return;var v=parseInt(inp.value,10);if(!v||v<1)v=1;inp.value=v;setCart(id,v);}
function setCart(id,v){if(v<1){delete cart[id];}else{cart[id]=v;}LSs('katalog_cart',cart);updateBadges();showCart();}
function rmCart(id){delete cart[id];LSs('katalog_cart',cart);updateBadges();showCart();}
function clearCart(){if(!Object.keys(cart).length)return;if(confirm('Очистить корзину?')){cart={};LSs('katalog_cart',cart);updateBadges();showCart();}}

/* ---------- Оформление и создание заявки ---------- */
function showOrderForm(){closeScreens();document.getElementById('scrForm').classList.add('open');}
function createOrder(){
  var name=document.getElementById('ofName').value.trim();
  var phone=document.getElementById('ofPhone').value.trim();
  if(!name){toast('Укажите имя или организацию');return;}
  if(!phone){toast('Укажите телефон');return;}
  var keys=Object.keys(cart);if(!keys.length){toast('Корзина пуста');return;}
  var items=[];keys.forEach(function(id){var p=findP(id);if(p)items.push({id:p.id,n:p.n,p:p.p,q:cart[id]});});
  if(!items.length){toast('Корзина пуста');return;}
  var now=new Date().toISOString();
  var number=invNum;invNum++;LSs('katalog_inv_num',invNum);
  var total=items.reduce(function(s,it){return s+it.p*it.q;},0);
  var order={num:number,iso:now,phone:phone,name:name,comm:document.getElementById('ofComm').value.trim(),items:items,total:total,done:false,
    inv:{number:number,iso:now,supplier:settings.sup||'',released:settings.rel||'',items:items,total:total}};
  orders.unshift(order);LSs('katalog_orders',orders);
  cart={};LSs('katalog_cart',cart);updateBadges();
  toast('Заявка № '+number+' создана');
  document.getElementById('ofName').value='';document.getElementById('ofPhone').value='';document.getElementById('ofComm').value='';
  openInvoice(order);
}

/* ---------- Заявки ---------- */
function setOTab(t){oTab=t;['all','new','done'].forEach(function(x){document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('on',x===t);});renderOrders();}
function showOrders(){closeScreens();document.getElementById('scrOrders').classList.add('open');renderOrders();}
function renderOrders(){
  var box=document.getElementById('ordList');box.innerHTML='';
  var list=orders.filter(function(o){if(oTab==='new')return !o.done;if(oTab==='done')return o.done;return true;});
  if(!list.length){box.innerHTML='<div class="empty">Заявок пока нет</div>';return;}
  list.forEach(function(o){
    var d=document.createElement('div');d.className='ocard';
    d.innerHTML='<div class="ot">№ '+esc(o.num)+' · '+fmtDate(o.iso)+'</div>'+
      '<div class="om">'+esc(o.phone)+' · позиций: '+o.items.length+' · '+fmt(o.total)+' ₽'+(o.done?' · ✅ выполнена':'')+'</div>'+
      '<div class="obtns">'+
      '<button onclick="openInvoiceById(\''+esc(o.num)+'\')">📄 Накладная</button>'+
      '<button class="b-done" onclick="toggleDone(\''+esc(o.num)+'\')">'+(o.done?'↩ Вернуть':'✔ Выполнена')+'</button>'+
      '<button class="b-del" onclick="delOrder(\''+esc(o.num)+'\')">🗑 Удалить</button>'+
      '</div>';
    box.appendChild(d);
  });
}
function getOrderByNum(n){for(var i=0;i<orders.length;i++)if(String(orders[i].num)===String(n))return orders[i];return null;}
function toggleDone(n){var o=getOrderByNum(n);if(!o)return;o.done=!o.done;LSs('katalog_orders',orders);updateBadges();renderOrders();}
function delOrder(n){if(!confirm('Удалить заявку № '+n+'?'))return;orders=orders.filter(function(o){return String(o.num)!==String(n);});LSs('katalog_orders',orders);updateBadges();renderOrders();}

/* ---------- Накладная ---------- */
function buildInvHTML(inv,o){
  var rows=inv.items.map(function(it,i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(it.n)+'</td><td class="r">'+it.q+'</td><td class="r">'+fmt(it.p)+'</td><td class="r">'+fmt(it.p*it.q)+'</td></tr>';
  }).join('');
  return '<h3>'+esc(inv.supplier||'Поставщик')+'</h3>'+
    '<div class="ihead">Накладная № '+esc(inv.number)+' от '+fmtDate(inv.iso)+'</div>'+
    '<div style="font-size:13px;margin-bottom:8px">Покупатель: '+esc(o.name)+' · тел. '+esc(o.phone)+'</div>'+
    '<table class="inv"><thead><tr><th>№</th><th>Наименование</th><th class="r">Кол-во</th><th class="r">Цена</th><th class="r">Сумма</th></tr></thead>'+
    '<tbody>'+rows+'<tr><td colspan="4" class="r"><b>Итого</b></td><td class="r"><b>'+fmt(inv.total)+' ₽</b></td></tr></tbody></table>'+
    '<div class="sig"><div>Отпустил: <span class="l">'+esc(inv.released||'____________')+'</span></div><div>Получил: <span class="l">&nbsp;</span></div></div>';
}
function openInvoice(o){
  curInvOrder=o;
  var inv=o.inv||{number:o.num,iso:o.iso,supplier:settings.sup||'',released:settings.rel||'',items:o.items,total:o.total};
  if(!o.inv)o.inv=inv;
  document.getElementById('invBody').innerHTML=buildInvHTML(inv,o);
  closeScreens();document.getElementById('scrInv').classList.add('open');
}
function openInvoiceById(n){var o=getOrderByNum(n);if(o)openInvoice(o);}
function saveInvToOrder(){
  if(!curInvOrder)return;
  curInvOrder.inv={number:curInvOrder.inv?curInvOrder.inv.number:curInvOrder.num,iso:curInvOrder.iso,
    supplier:settings.sup||curInvOrder.inv&&curInvOrder.inv.supplier||'',released:settings.rel||curInvOrder.inv&&curInvOrder.inv.released||'',
    items:curInvOrder.items,total:curInvOrder.total};
  LSs('katalog_orders',orders);toast('Накладная сохранена в заявке');
}
function exportCSV(){
  if(!curInvOrder)return;
  var inv=curInvOrder.inv||{number:curInvOrder.num,items:curInvOrder.items,total:curInvOrder.total};
  var lines=['\uFEFFНомер;Дата;Наименование;Кол-во;Цена;Сумма'];
  inv.items.forEach(function(it){
    lines.push([inv.number,new Date(inv.iso).toLocaleDateString('ru-RU'),'"'+String(it.n).replace(/"/g,'""')+'"',it.q,String(it.p).replace('.',','),String(it.p*it.q).replace('.',',')].join(';'));
  });
  lines.push(';;;;Итого;'+String(inv.total).replace('.',','));
  var blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nakladnaya-'+inv.number+'.csv';a.click();
}

/* ---------- Настройки: модалка с корректным закрытием ---------- */
function openSettings(){
  document.getElementById('stSup').value=settings.sup||'';
  document.getElementById('stRel').value=settings.rel||'';
  document.getElementById('stNum').value=invNum;
  document.getElementById('mSet').classList.add('open');
}
function closeSettings(){document.getElementById('mSet').classList.remove('open');}
function saveSettings(){
  settings.sup=document.getElementById('stSup').value.trim();
  settings.rel=document.getElementById('stRel').value.trim();
  var n=parseInt(document.getElementById('stNum').value,10);
  if(n&&n>0){invNum=n;LSs('katalog_inv_num',invNum);}
  LSs('katalog_settings',settings);
  closeSettings();toast('Настройки сохранены');
}
document.getElementById('mSet').addEventListener('click',function(e){if(e.target===this)closeSettings();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSettings();});

/* ---------- Навигация ---------- */
function closeScreens(){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('open');});}
function backToOrders(){closeScreens();document.getElementById('scrOrders').classList.add('open');renderOrders();}

if(!LS('katalog_hint_off',0))document.getElementById('hintInstall').style.display='flex';

collectData();
renderCats();

updateBadges();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('service-worker.js').catch(function(){});}catch(e){}}
