<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a237e">
<title>Каталог оптовых цен</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--primary:#1a237e;--primary-light:#314796;--bg:#f5f5f5;--text:#333;--border:#ddd;--danger:#d32f2f;--ok:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px}
header{background:var(--primary);color:#fff;padding:12px 15px;position:sticky;top:0;z-index:50}
header h1{margin:0;font-size:19px}
header .sub{font-size:12px;opacity:.9;margin-top:3px}
.topbar{display:flex;gap:10px;margin:10px}
.topbar button{flex:1;background:#fff;color:var(--primary);border:none;border-radius:10px;padding:10px;font-size:15px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:pointer;position:relative}
.badge{background:#f5b301;color:#333;border-radius:20px;padding:2px 8px;font-size:12px;margin-left:4px}
.controls{display:flex;gap:8px;margin:0 10px 12px}
.controls select,.controls input{flex:1;min-width:0;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff}
.banner{background:#e3f2fd;color:#1a237e;margin:0 10px 10px;padding:9px 12px;border-radius:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{background:none;border:none;font-size:20px;cursor:pointer;color:#555;line-height:1}
.list{padding:0 10px}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card img.ph{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#eee}
.card .ph-emoji{width:52px;height:52px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.info{flex:1;min-width:0}
.info .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.info .ct{font-size:11.5px;color:#888;margin:2px 0 4px}
.info .pr{font-size:16px;font-weight:700;color:var(--primary)}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.qty{display:flex;align-items:stretch;border:1.5px solid var(--primary);border-radius:10px;overflow:hidden}
.qty button{width:30px;border:none;background:#fff;color:var(--primary);font-size:18px;font-weight:700;cursor:pointer}
.qty input{width:34px;text-align:center;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);font-size:14px;padding:4px 0}
.addbtn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
.screen{display:none}
.screen.active{display:block}
.rq{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rq .t{font-weight:700;font-size:15px}
.rq .d{font-size:12.5px;color:#666;margin:4px 0 8px}
.rq .acts{display:flex;gap:6px;flex-wrap:wrap}
.rq .acts button{border:1px solid var(--border);background:#f4f6fb;border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;font-weight:600;color:var(--primary)}
.rq .acts button.del{color:var(--danger)}
.tabs{display:flex;gap:8px;margin:0 10px 10px}
.tabs button{flex:1;border:1px solid var(--primary);background:#fff;color:var(--primary);border-radius:24px;padding:9px;font-weight:600;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--primary);color:#fff}
.tabs button .b{background:#f5b301;color:#333;border-radius:20px;padding:1px 7px;font-size:12px;margin-left:4px}
.inv{background:#fff;margin:10px;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.inv h2{margin:0 0 4px;font-size:17px;text-align:center}
.inv table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.inv th,.inv td{border:1px solid #999;padding:5px 6px;text-align:left}
.inv th{background:#eef1f8}
.inv .num{text-align:center;width:34px}
.inv .qtyc,.inv .pricec,.inv .sumc{text-align:right;white-space:nowrap}
.inv .foot{margin-top:14px;display:flex;justify-content:space-between;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;justify-content:center;align-items:center;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.modal h3{margin:0 0 14px;font-size:17px}
.modal label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
.modal input{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.modal .btnrow{display:flex;gap:8px;margin-top:16px}
.modal .btnrow button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-size:14px}
.modal .btnrow .save{background:var(--primary);color:#fff}
.modal .btnrow .cancel{background:#eceff4;color:#333}
.fab{position:fixed;bottom:18px;right:14px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:22px;box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer;z-index:60}
.cartfoot{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px;box-shadow:0 -2px 8px rgba(0,0,0,.12);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:55}
.cartfoot .sum{font-weight:700;font-size:16px}
.cartfoot button{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;font-size:14px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--primary);color:#fff;padding:9px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:3000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:#888;padding:30px 10px}
.hdr2{display:flex;align-items:center;gap:10px;padding:10px}
.hdr2 .back{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
@media print{header,.topbar,.controls,.hdr2,.inv .noprint{display:none!important}.inv{margin:0;border-radius:0}}
</style>
</head>
<body>

<header><h1>Каталог оптовых цен</h1><div class="sub">Цены оптовые, без НДС, с доставкой</div></header>

<div id="scr-catalog" class="screen active">
  <div class="topbar">
    <button onclick="showScreen('cart')">🛒 Корзина <span class="badge" id="cart-badge">0</span></button>
    <button onclick="showScreen('requests')">📋 Заявки <span class="badge" id="req-badge">0</span></button>
  </div>
  <div class="controls">
    <select id="cat-filter" onchange="renderCatalog()"><option value="">Все категории</option></select>
    <input type="text" id="search" placeholder="🔍 Поиск товара" oninput="renderCatalog()">
  </div>
  <div class="banner" id="install-banner">📱 Добавьте каталог на главный экран — будет работать как приложение.<button onclick="dismissBanner()">&times;</button></div>
  <div class="list" id="prod-list"></div>
</div>

<div id="scr-cart" class="screen">
  <div class="hdr2"><button class="back" onclick="showScreen('catalog')">← Каталог</button></div>
  <div class="list" id="cart-list"></div>
  <div class="cartfoot" id="cart-foot" style="display:none">
    <div class="sum" id="cart-sum">0,00 ₽</div>
    <button onclick="openOrderModal()">Оформить заявку</button>
  </div>
</div>

<div id="scr-requests" class="screen">
  <div class="hdr2"><button class="back" onclick="showScreen('catalog')">← В каталог</button></div>
  <div class="tabs">
    <button id="tab-all" class="on" onclick="setTab('all')">Все</button>
    <button id="tab-new" onclick="setTab('new')">Необработанные <span class="b" id="new-badge">0</span></button>
    <button id="tab-done" onclick="setTab('done')">Выполненные</button>
  </div>
  <div class="list" id="req-list"></div>
</div>

<div id="scr-invoice" class="screen">
  <div class="hdr2"><button class="back" onclick="backFromInvoice()">← Назад</button></div>
  <div class="inv" id="inv-body"></div>
  <div style="display:flex;gap:8px;margin:0 10px 14px" class="noprint">
    <button class="addbtn" style="flex:1;padding:12px" onclick="saveInvoiceToReq()">💾 Сохранить накладную в заявке</button>
    <button class="addbtn" style="flex:1;padding:12px;background:var(--ok)" onclick="window.print()">🖨 Печать</button>
  </div>
</div>

<div class="overlay" id="order-overlay">
  <div class="modal">
    <h3>📝 Оформление заявки</h3>
    <label>Ваше имя / название организации *</label>
    <input type="text" id="ord-name">
    <label>Телефон *</label>
    <input type="tel" id="ord-phone" placeholder="+7...">
    <div class="btnrow">
      <button class="cancel" onclick="closeOrderModal()">Отмена</button>
      <button class="save" onclick="submitOrder()">Сохранить заявку</button>
    </div>
  </div>
</div>

<div class="overlay" id="settings-overlay">
  <div class="modal">
    <h3>⚙️ Подпись и поставщик</h3>
    <label>Поставщик (для шапки накладной)</label>
    <input type="text" id="set-supplier">
    <label>ФИО для строки «Отпустил»</label>
    <input type="text" id="set-released">
    <label>Следующий номер накладной</label>
    <input type="text" id="set-invnum">
    <div class="btnrow">
      <button class="cancel" onclick="closeSettings()">Отмена</button>
      <button class="save" onclick="saveSettings()">Сохранить</button>
    </div>
  </div>
</div>

<button class="fab" onclick="openSettings()" title="Настройки">⚙️</button>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
"use strict";
// ==== хранилище (с миграцией старых ключей) ====
function load(k, fallback){ 
  for(var pre of ['katalog_','catalog_']){ 
    var v=localStorage.getItem(pre+k); 
    if(v!==null){ try{return JSON.parse(v)}catch(e){} } 
  } 
  return fallback; 
}
function save(k,v){ localStorage.setItem('katalog_'+k, JSON.stringify(v)); }
var cart=load('cart',{});
var requests=load('requests',[]);
var settings=load('settings',{});
var qtySel={};          // выбранное количество в каталоге (по умолчанию 0)
var allProducts=[];     // нормализованные товары
var catOrder=[];        // порядок категорий
var currentTab='all';
var invoiceCtx=null;    // {reqIndex, snapshot}
var reqFilter='all';

// ==== разбор data.js ====
function normalizeItem(raw, cat){
  var id,name,price;
  if(Array.isArray(raw)){
    // формат [название, цена, id] или [id, название, цена]
    if(typeof raw[0]==='string' && typeof raw[1]==='number'){ name=raw[0]; price=raw[1]; id=raw[2]||('x'+raw.indexOf(raw)); }
    else if(typeof raw[1]==='string' && typeof raw[2]==='number'){ id=raw[0]; name=raw[1]; price=raw[2]; }
    else { name=String(raw[0]||'Товар'); price=Number(raw[1])||0; id=raw[2]||('x'+Math.random()); }
  } else if(raw && typeof raw==='object'){
    name=raw.n||raw.name||raw.title||'Товар'; price=Number(raw.p!=null?raw.p:raw.price)||0; id=raw.id||raw.code||('x'+Math.random());
  } else return null;
  if(!/^[a-zA-Z0-9_\-]+$/.test(String(id))) id='x'+Math.abs(hash(String(id)+name));
  return {id:String(id),name:name,price:price,cat:cat};
}
function hash(s){ var h=0; for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }
function findCatalog(){
  if(window.DATA && (window.DATA.groups||Array.isArray(window.DATA))) return window.DATA;
  if(window.catalogData) return window.catalogData;
  if(window.data) return window.data;
  // автопоиск: перебираем глобальные переменные, ищем объект с groups или большой массив товаров
  var candidates=[];
  for(var k in window){
    try{
      var v=window[k];
      if(!v || typeof v!=='object') continue;
      if(v===window || v===document) continue;
      if(v.groups && typeof v.groups==='object') return v;
      if(Array.isArray(v) && v.length>100) candidates.push({k:k,v:v});
    }catch(e){}
  }
  return candidates.length ? candidates[0].v : null;
}
function parseData(){
  var d=findCatalog();
  if(!d) return;
  var groups=null;
  if(d.groups && typeof d.groups==='object') groups=d.groups;
  else if(!Array.isArray(d) && typeof d==='object'){
    var looksGroups=true;
    for(var k in d){ if(!Array.isArray(d[k])){looksGroups=false;break;} }
    if(looksGroups) groups=d;
  }
  if(groups){
    for(var cat in groups){
      var arr=groups[cat];
      if(!Array.isArray(arr)) continue;
      catOrder.push(cat);
      arr.forEach(function(raw,i){
        var p=normalizeItem(raw,cat);
        if(p){ if(!p.id||allProducts.some(function(q){return q.id===p.id})) p.id='x'+catOrder.length+'_'+i+'_'+Math.abs(hash(p.name)); allProducts.push(p); }
      });
    }
  } else if(Array.isArray(d)){
    d.forEach(function(raw,i){
      var cat=(Array.isArray(raw)&&typeof raw[raw.length-1]==='string'&&typeof raw[0]==='string'&&typeof raw[1]==='number')?raw[raw.length-1]:'Прочее';
      var p=normalizeItem(raw,cat);
      if(p){p.id='x'+i+'_'+p.id; allProducts.push(p);}
      if(catOrder.indexOf(cat)<0) catOrder.push(cat);
    });
  }
}

// ==== каталог ====
function fmt(n){ return n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderCatalog(){
  var cf=document.getElementById('cat-filter'), sel=cf.value;
  if(cf.options.length<=1){
    catOrder.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;cf.appendChild(o);});
  }
  var q=(document.getElementById('search').value||'').toLowerCase().trim();
  var box=document.getElementById('prod-list'); box.innerHTML='';
  var shown=0;
  catOrder.forEach(function(cat){
    if(sel && cat!==sel) return;
    var items=allProducts.filter(function(p){return p.cat===cat});
    if(q) items=items.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0});
    if(!items.length) return;
    var h='<div class="ct-title" style="font-weight:700;font-size:15px;margin:6px 2px">'+esc(cat)+'</div>';
    box.insertAdjacentHTML('beforeend',h);
    items.forEach(function(p){
      shown++;
      var v=qtySel[p.id]||0;
      var imgSrc='img/'+p.id+'.jpg';
      box.insertAdjacentHTML('beforeend',
        '<div class="card">'+
        '<img class="ph" src="'+imgSrc+'" alt="" onerror="this.outerHTML=\'<div class=&quot;ph-emoji&quot;>📦</div>\'">'+
        '<div class="info"><div class="nm">'+esc(p.name)+'</div><div class="ct">'+esc(p.cat)+'</div><div class="pr">'+fmt(p.price)+'</div></div>'+
        '<div class="side">'+
          '<div class="qty"><button onclick="bump(\''+p.id+'\',-1)">−</button><input type="text" inputmode="numeric" id="q_'+p.id+'" value="'+v+'" onchange="setQty(\''+p.id+'\',this.value)"><button onclick="bump(\''+p.id+'\',1)">+</button></div>'+
          '<button class="addbtn" onclick="addFromCard(\''+p.id+'\')">В корзину</button>'+
        '</div></div>');
    });
  });
  if(!shown) box.innerHTML='<div class="empty">Товары не найдены</div>';
}
function bump(id,d){
  var v=(qtySel[id]||0)+d; if(v<0)v=0; qtySel[id]=v;
  var el=document.getElementById('q_'+id); if(el) el.value=v;
}
function setQty(id,val){
  var v=parseInt(String(val).replace(/[^0-9]/g,''),10); if(isNaN(v)||v<0)v=0; if(v>9999)v=9999;
  qtySel[id]=v; document.getElementById('q_'+id).value=v;
}
function addFromCard(id){
  var v=qtySel[id]||0;
  if(!v){ showToast('Укажите количество — стрелочками или вручную'); return; }
  cart[id]=(cart[id]||0)+v; save('cart',cart);
  qtySel[id]=0; document.getElementById('q_'+id).value=0;
  updateBadges(); showToast('Добавлено: '+v+' шт.');
}

// ==== корзина ====
function prodById(id){ for(var i=0;i<allProducts.length;i++) if(allProducts[i].id===id) return allProducts[i]; return null; }
function cartSum(){ var s=0; for(var id in cart){ var p=prodById(id); if(p) s+=p.price*cart[id]; } return s; }
function renderCart(){
  var box=document.getElementById('cart-list'); box.innerHTML='';
  var ids=Object.keys(cart).filter(function(id){return cart[id]>0});
  document.getElementById('cart-foot').style.display=ids.length?'flex':'none';
  if(!ids.length){ box.innerHTML='<div class="empty">Корзина пуста</div>'; return; }
  ids.forEach(function(id){
    var p=prodById(id); if(!p) return;
    box.insertAdjacentHTML('beforeend',
      '<div class="card"><div class="ph-emoji">📦</div>'+
      '<div class="info"><div class="nm">'+esc(p.name)+'</div><div class="pr">'+fmt(p.price)+' × '+cart[id]+' = '+fmt(p.price*cart[id])+'</div></div>'+
      '<div class="side"><div class="qty"><button onclick="cartBump(\''+id+'\',-1)">−</button><input type="text" inputmode="numeric" value="'+cart[id]+'" onchange="cartSet(\''+id+'\',this.value)"><button onclick="cartBump(\''+id+'\',1)">+</button></div>'+
      '<button class="addbtn" style="background:var(--danger)" onclick="cartDel(\''+id+'\')">Убрать</button></div></div>');
  });
  document.getElementById('cart-sum').textContent=fmt(cartSum());
}
function cartBump(id,d){ var v=(cart[id]||0)+d; if(v<=0){delete cart[id];} else cart[id]=v; save('cart',cart); renderCart(); updateBadges(); }
function cartSet(id,val){ var v=parseInt(String(val).replace(/[^0-9]/g,''),10); if(isNaN(v)||v<=0){delete cart[id];} else cart[id]=Math.min(v,9999); save('cart',cart); renderCart(); updateBadges(); }
function cartDel(id){ delete cart[id]; save('cart',cart); renderCart(); updateBadges(); }

// ==== заявка ====
function openOrderModal(){ if(!Object.keys(cart).length){ showToast('Корзина пуста'); return; } document.getElementById('ord-name').value=settings.lastName||''; document.getElementById('ord-phone').value=settings.lastPhone||''; document.getElementById('order-overlay').classList.add('open'); }
function closeOrderModal(){ document.getElementById('order-overlay').classList.remove('open'); }
function submitOrder(){
  var nm=document.getElementById('ord-name').value.trim();
  var ph=document.getElementById('ord-phone').value.trim();
  if(!nm||!ph){ showToast('Заполните имя и телефон'); return; }
  settings.lastName=nm; settings.lastPhone=ph;
  var num=Number(settings.invNum)||35159;
  var items=[]; for(var id in cart){ var p=prodById(id); if(p&&cart[id]>0) items.push({id:id,n:p.name,p:p.price,q:cart[id]}); }
  var req={ num:num, date:new Date().toISOString(), phone:ph, name:nm, items:items, done:false,
    inv:{ num:num, dateStr:fmtDate(new Date()), supplier:settings.supplier||'', released:settings.released||'', items:items.slice() } };
  requests.unshift(req); save('requests',requests);
  settings.invNum=num+1; save('settings',settings);
  cart={}; save('cart',cart); qtySel={};
  closeOrderModal(); updateBadges(); showScreen('requests'); showToast('Заявка №'+num+' сохранена');
}
function fmtDate(d){ var p=function(x){return (x<10?'0':'')+x}; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes()); }

// ==== заявки ====
function setTab(t){ reqFilter=t; ['all','new','done'].forEach(function(x){document.getElementById('tab-'+x).classList.toggle('on',x===t)}); renderRequests(); }
function renderRequests(){
  var box=document.getElementById('req-list'); box.innerHTML='';
  var list=requests.filter(function(r){return reqFilter==='all'||(reqFilter==='new'&&!r.done)||(reqFilter==='done'&&r.done)});
  var nb=requests.filter(function(r){return !r.done}).length;
  document.getElementById('new-badge').textContent=nb;
  if(!list.length){ box.innerHTML='<div class="empty">Заявок пока нет</div>'; return; }
  list.forEach(function(r){
    var sum=r.items.reduce(function(s,it){return s+it.p*it.q},0);
    var idx=requests.indexOf(r);
    box.insertAdjacentHTML('beforeend',
      '<div class="rq"><div class="t">№ '+r.num+' · '+fmtDate(new Date(r.date))+'</div>'+
      '<div class="d">'+esc(r.phone||'')+' · позиций: '+r.items.length+' · '+fmt(sum)+'</div>'+
      '<div class="acts">'+
      '<button onclick="openInvoice('+idx+')">📄 Накладная</button>'+
      '<button onclick="toggleDone('+idx+')">'+(r.done?'↩ Вернуть в работу':'✔ Выполнена')+'</button>'+
      '<button class="del" onclick="delReq('+idx+')">🗑 Удалить</button>'+
      '</div></div>');
  });
}
function toggleDone(i){ requests[i].done=!requests[i].done; save('requests',requests); renderRequests(); updateBadges(); }
function delReq(i){ if(!confirm('Удалить заявку №'+requests[i].num+'?')) return; requests.splice(i,1); save('requests',requests); renderRequests(); updateBadges(); }

// ==== накладная ====
function openInvoice(i){
  var r=requests[i]; if(!r) return;
  var inv=r.inv||{ num:r.num, dateStr:fmtDate(new Date(r.date)), supplier:settings.supplier||'', released:settings.released||'', items:r.items.slice() };
  invoiceCtx={reqIndex:i, snapshot:inv};
  renderInvoice(inv); showScreen('invoice');
}
function renderInvoice(inv){
  var rows=''; var total=0;
  inv.items.forEach(function(it,i){
    var s=it.p*it.q; total+=s;
    rows+='<tr><td class="num">'+(i+1)+'</td><td>'+esc(it.n)+'</td><td class="qtyc">'+it.q+'</td><td class="pricec">'+fmt(it.p)+'</td><td class="sumc">'+fmt(s)+'</td></tr>';
  });
  document.getElementById('inv-body').innerHTML=
    '<h2>НАКЛАДНАЯ № '+esc(inv.num)+'</h2>'+
    '<div style="text-align:center;font-size:12.5px;color:#555">от '+esc(inv.dateStr)+'</div>'+
    (inv.supplier?'<div style="margin-top:8px"><b>Поставщик:</b> '+esc(inv.supplier)+'</div>':'')+
    '<table><tr><th>№</th><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>'+rows+
    '<tr><td colspan="4" style="text-align:right;font-weight:700">Итого</td><td class="sumc" style="font-weight:700">'+fmt(total)+'</td></tr></table>'+
    '<div class="foot"><div>Отпустил: <b>'+esc(inv.released||'____________')+'</b></div><div>Получил: ____________</div></div>';
}
function saveInvoiceToReq(){
  if(!invoiceCtx) return;
  var inv={ num:invoiceCtx.snapshot.num, dateStr:invoiceCtx.snapshot.dateStr,
    supplier:settings.supplier||invoiceCtx.snapshot.supplier||'',
    released:settings.released||invoiceCtx.snapshot.released||'',
    items:invoiceCtx.snapshot.items.slice() };
  requests[invoiceCtx.reqIndex].inv=inv; save('requests',requests);
  showToast('Накладная сохранена в заявке');
}
function backFromInvoice(){ invoiceCtx=null; showScreen('requests'); }

// ==== настройки ====
function openSettings(){
  document.getElementById('set-supplier').value=settings.supplier||'';
  document.getElementById('set-released').value=settings.released||'';
  document.getElementById('set-invnum').value=settings.invNum||'';
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings(){ document.getElementById('settings-overlay').classList.remove('open'); }
function saveSettings(){
  settings.supplier=document.getElementById('set-supplier').value.trim();
  settings.released=document.getElementById('set-released').value.trim();
  var n=parseInt(document.getElementById('set-invnum').value,10);
  if(!isNaN(n)&&n>0) settings.invNum=n;
  save('settings',settings); closeSettings(); showToast('Настройки сохранены');
}

// ==== общее ====
function showScreen(s){
  ['catalog','cart','requests','invoice'].forEach(function(x){document.getElementById('scr-'+x).classList.toggle('active',x===s)});
  if(s==='cart') renderCart();
  if(s==='requests') renderRequests();
  window.scrollTo(0,0);
}
function updateBadges(){
  var cnt=0; for(var id in cart) cnt+=cart[id];
  document.getElementById('cart-badge').textContent=cnt;
  document.getElementById('req-badge').textContent=requests.length;
}
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show')},2200); }
function dismissBanner(){ document.getElementById('install-banner').style.display='none'; localStorage.setItem('banner_closed','1'); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeOrderModal(); closeSettings(); }
});
document.getElementById('order-overlay').addEventListener('click',function(e){ if(e.target===this) closeOrderModal(); });
document.getElementById('settings-overlay').addEventListener('click',function(e){ if(e.target===this) closeSettings(); });

parseData();
renderCatalog();
updateBadges();
renderRequests();
if(localStorage.getItem('banner_closed')) document.getElementById('install-banner').style.display='none';
if(!allProducts.length) document.getElementById('prod-list').innerHTML='<div class="empty">Каталог пуст — проверьте файл data.js</div>';
</script>
</body>
</html>
